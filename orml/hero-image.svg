<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bd34fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#41d1ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#47caff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#bd34fe;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="150" r="120" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Central icon - database/data symbol -->
  <g transform="translate(160, 80)">
    <ellipse cx="40" cy="10" rx="35" ry="10" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    <path d="M5 10 L5 60 Q5 70 40 70 Q75 70 75 60 L75 10" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    <ellipse cx="40" cy="35" rx="35" ry="10" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
    <ellipse cx="40" cy="60" rx="35" ry="10" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Prediction arrow -->
  <g transform="translate(240, 130)">
    <path d="M0 20 L40 20 L40 10 L60 25 L40 40 L40 30 L0 30 Z" fill="url(#grad2)"/>
  </g>
  
  <!-- Decision node -->
  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="60" height="50" rx="8" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    <line x1="10" y1="25" x2="50" y2="25" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="30" y1="10" x2="30" y2="40" stroke="url(#grad1)" stroke-width="2"/>
  </g>
  
  <!-- Chart bars -->
  <g transform="translate(280, 180)">
    <rect x="0" y="30" width="15" height="40" fill="url(#grad1)" opacity="0.8" rx="2"/>
    <rect x="20" y="15" width="15" height="55" fill="url(#grad1)" opacity="0.6" rx="2"/>
    <rect x="40" y="25" width="15" height="45" fill="url(#grad1)" opacity="0.8" rx="2"/>
  </g>
  
  <!-- Network nodes -->
  <g transform="translate(50, 160)">
    <circle cx="20" cy="20" r="12" fill="url(#grad1)" opacity="0.7"/>
    <circle cx="60" cy="10" r="10" fill="url(#grad1)" opacity="0.5"/>
    <circle cx="60" cy="40" r="10" fill="url(#grad1)" opacity="0.5"/>
    <line x1="30" y1="20" x2="52" y2="12" stroke="url(#grad2)" stroke-width="2"/>
    <line x1="30" y1="22" x2="52" y2="38" stroke="url(#grad2)" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="url(#grad1)">OR × ML</text>
</svg>